<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Agent Airlift architecture</title>
  <desc id="desc">A degraded source agent session and provider health signal flow through a deterministic canonical core into handoff docs, target exports, and an audit gate.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#08111f"/>
      <stop offset="48%" stop-color="#102436"/>
      <stop offset="100%" stop-color="#142416"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#172337"/>
      <stop offset="100%" stop-color="#101826"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d7ffe2"/>
      <stop offset="100%" stop-color="#8ef0b1"/>
    </linearGradient>
    <linearGradient id="footer" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#07121d"/>
      <stop offset="100%" stop-color="#0b1d22"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000000" flood-opacity="0.34"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9fd8ff"/>
    </marker>
  </defs>

  <rect width="1600" height="900" rx="38" fill="url(#bg)"/>
  <circle cx="1390" cy="92" r="260" fill="#7effb2" opacity="0.08"/>
  <circle cx="170" cy="814" r="300" fill="#66b7ff" opacity="0.09"/>
  <path d="M90 730 C350 590 470 780 680 640 C900 493 1050 554 1266 430 C1390 360 1490 384 1564 422" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="4"/>

  <text x="84" y="96" fill="#eff8ff" font-size="46" font-family="Avenir Next, ui-sans-serif, system-ui, sans-serif" font-weight="800">Airlift the session, not the vibes</text>
  <text x="88" y="145" fill="#bad0df" font-size="22" font-family="Avenir Next, ui-sans-serif, system-ui, sans-serif">Degraded provider context becomes a deterministic handoff bundle.</text>

  <g filter="url(#shadow)">
    <rect x="86" y="230" width="330" height="134" rx="28" fill="url(#panel)" stroke="#34506c"/>
    <text x="116" y="281" fill="#ffffff" font-size="28" font-family="Avenir Next, ui-sans-serif, system-ui, sans-serif" font-weight="700">Source session</text>
    <text x="116" y="318" fill="#b8c6d4" font-size="18" font-family="Menlo, SFMono-Regular, monospace">Claude Code / Codex</text>
    <text x="116" y="348" fill="#7fb7ff" font-size="17" font-family="Menlo, SFMono-Regular, monospace">JSONL + tool blocks</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="86" y="466" width="330" height="134" rx="28" fill="url(#panel)" stroke="#34506c"/>
    <text x="116" y="517" fill="#ffffff" font-size="28" font-family="Avenir Next, ui-sans-serif, system-ui, sans-serif" font-weight="700">Health signal</text>
    <text x="116" y="554" fill="#b8c6d4" font-size="18" font-family="Menlo, SFMono-Regular, monospace">Marginlab / file / none</text>
    <text x="116" y="584" fill="#ffca7a" font-size="17" font-family="Menlo, SFMono-Regular, monospace">degraded -> migrate</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="552" y="318" width="400" height="218" rx="34" fill="url(#core)" stroke="#e6fff0" stroke-opacity="0.8"/>
    <text x="600" y="378" fill="#102418" font-size="36" font-family="Avenir Next, ui-sans-serif, system-ui, sans-serif" font-weight="900">Canonical core</text>
    <text x="600" y="424" fill="#183d29" font-size="19" font-family="Menlo, SFMono-Regular, monospace">deterministic schema</text>
    <text x="600" y="458" fill="#183d29" font-size="19" font-family="Menlo, SFMono-Regular, monospace">stable hashes</text>
    <text x="600" y="492" fill="#183d29" font-size="19" font-family="Menlo, SFMono-Regular, monospace">loss accounting</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1098" y="204" width="382" height="128" rx="28" fill="url(#panel)" stroke="#34506c"/>
    <text x="1130" y="252" fill="#ffffff" font-size="28" font-family="Avenir Next, ui-sans-serif, system-ui, sans-serif" font-weight="700">Handoff bundle</text>
    <text x="1130" y="289" fill="#b8c6d4" font-size="18" font-family="Menlo, SFMono-Regular, monospace">HANDOFF.md + AGENTS.md</text>
    <text x="1130" y="317" fill="#7effb2" font-size="17" font-family="Menlo, SFMono-Regular, monospace">objective, files, risks</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1098" y="386" width="382" height="128" rx="28" fill="url(#panel)" stroke="#34506c"/>
    <text x="1130" y="434" fill="#ffffff" font-size="28" font-family="Avenir Next, ui-sans-serif, system-ui, sans-serif" font-weight="700">Target exports</text>
    <text x="1130" y="471" fill="#b8c6d4" font-size="18" font-family="Menlo, SFMono-Regular, monospace">Codex / Kiro / OpenCode</text>
    <text x="1130" y="499" fill="#7fb7ff" font-size="17" font-family="Menlo, SFMono-Regular, monospace">readable session seeds</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1098" y="568" width="382" height="128" rx="28" fill="url(#panel)" stroke="#34506c"/>
    <text x="1130" y="616" fill="#ffffff" font-size="28" font-family="Avenir Next, ui-sans-serif, system-ui, sans-serif" font-weight="700">Audit gate</text>
    <text x="1130" y="653" fill="#b8c6d4" font-size="18" font-family="Menlo, SFMono-Regular, monospace">accounting + hashes</text>
    <text x="1130" y="681" fill="#7effb2" font-size="17" font-family="Menlo, SFMono-Regular, monospace">exports match canonical</text>
  </g>

  <path d="M416 297 C486 297 496 370 552 390" fill="none" stroke="#9fd8ff" stroke-width="5" marker-end="url(#arrow)"/>
  <path d="M416 533 C486 533 496 476 552 462" fill="none" stroke="#9fd8ff" stroke-width="5" marker-end="url(#arrow)"/>
  <path d="M952 388 C1016 354 1034 268 1098 268" fill="none" stroke="#9fd8ff" stroke-width="5" marker-end="url(#arrow)"/>
  <path d="M952 427 C1016 432 1034 450 1098 450" fill="none" stroke="#9fd8ff" stroke-width="5" marker-end="url(#arrow)"/>
  <path d="M952 486 C1018 542 1034 632 1098 632" fill="none" stroke="#9fd8ff" stroke-width="5" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="382" y="732" width="836" height="76" rx="22" fill="url(#footer)" stroke="#35546f"/>
    <text x="424" y="764" fill="#d7ffe2" font-size="19" font-family="Menlo, SFMono-Regular, monospace">No AI APIs. No uploads.</text>
    <text x="424" y="790" fill="#9fd8ff" font-size="19" font-family="Menlo, SFMono-Regular, monospace">Explicit transfers. Auditable trail.</text>
  </g>
</svg>
